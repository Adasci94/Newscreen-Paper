<script>
/* Rete di sicurezza: se qualcosa esplode prima che l'app disegni, l'utente
   deve vedere il motivo, non una pagina bianca. */
(function () {
  function show(msg) {
    var el = document.getElementById('bootError');
    if (!el) {
      el = document.createElement('pre');
      el.id = 'bootError';
      el.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:9999;margin:0;' +
        'padding:12px 14px;background:#7a1d14;color:#fff;font:12px/1.5 ui-monospace,monospace;' +
        'white-space:pre-wrap;max-height:60vh;overflow:auto';
      (document.body || document.documentElement).appendChild(el);
    }
    el.textContent += msg + '\n';
  }
  window.addEventListener('error', function (e) {
    show('ERRORE: ' + (e.message || e.type) + '\n  ' + (e.filename || '') + ':' + (e.lineno || '?'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    show('PROMISE: ' + ((r && (r.stack || r.message)) || r));
  });
})();
</script>
